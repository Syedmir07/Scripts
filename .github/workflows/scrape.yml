name: Yocket Periodic Scraper

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [restart_scraper]

# This ensures that if a manual run starts, it doesn't collide with the automated loop
concurrency:
  group: yocket-scraper
  cancel-in-progress: false 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "data/*.jsonl"
          git add .gitattributes || true

      - name: Install dependencies
        run: npm install axios

      - name: Run yocket
        env:
          YOCKET_TOKEN: ${{ secrets.YOCKET_TOKEN }} # Passes your secret to the script
        run: node yocket.cjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Automated data update [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Trigger next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }} # Uses your PAT to restart the loop
        run: |
          gh workflow run "Yocket Periodic Scraper"